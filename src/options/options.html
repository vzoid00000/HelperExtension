<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>OSDP News Helper – Einstellungen</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 20px; }
    select, input[type="number"], input[type="time"] { font: inherit; padding: 6px 8px; margin-top: 3px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .card > label { margin-top: 12px; }
    .hint { font-weight: 400; display: block; }
    textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OSDP News Helper – Einstellungen</h1>
  <div id="status" class="status" hidden></div>

  <section class="card">
    <h2>Sprachmodell (Relevanzprüfung und Tagging)</h2>
    <label>Anbieter
      <select id="llmProvider">
        <option value="claude">Claude API</option>
        <option value="local">Lokales Modell am eigenen PC (OpenAI-kompatibel)</option>
      </select>
    </label>
    <label>Claude API-Key
      <input id="anthropicApiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
      <span class="hint muted small">Erstellen unter console.anthropic.com → API Keys. Wird nur lokal in dieser Extension gespeichert.</span>
    </label>
    <label>Claude Modell
      <input id="anthropicModel" type="text" placeholder="claude-opus-5-5">
    </label>
  </section>

  <section class="card">
    <h2>Lokales Modell</h2>
    <label>Server-URL
      <input id="localLlmUrl" type="text" placeholder="http://192.168.1.50:11434/v1">
      <span class="hint muted small">Basis-URL der OpenAI-kompatiblen Schnittstelle (Ollama: Port 11434, LM Studio: 1234, vLLM: 8000). <code>/v1</code> wird automatisch ergänzt.</span>
    </label>
    <label>Modellname
      <input id="localLlmModel" type="text" placeholder="qwen2.5:32b">
    </label>
    <label>API-Key (optional)
      <input id="localLlmApiKey" type="password" autocomplete="off">
    </label>
    <label>Timeout je Anfrage (Sekunden)
      <input id="localLlmTimeoutSec" type="number" min="30" max="3600" step="30">
    </label>
    <div class="row">
      <button id="btnTestLocal" class="ghost">Verbindung testen</button>
    </div>
  </section>

  <section class="card">
    <h2>Übersetzung</h2>
    <label>Anbieter
      <select id="translator">
        <option value="claude">Claude API (beste Qualität)</option>
        <option value="local">Lokales Modell</option>
        <option value="deepl">DeepL API (Free-Key reicht)</option>
        <option value="chrome">Chrome integriert (kostenlos, mittlere Qualität, Chrome 138+)</option>
      </select>
    </label>
    <label>DeepL API-Key
      <input id="deeplApiKey" type="password" placeholder="xxxxxxxx-…:fx" autocomplete="off">
      <span class="hint muted small">Free-Keys enden auf „:fx“ und nutzen automatisch den Free-Endpunkt.</span>
    </label>
  </section>

  <section class="card">
    <h2>Quellen</h2>
    <label>Quellen-Liste (eine pro Zeile: <code>Name | URL | cyber/krimisi/both | rss/html | URL-Muster</code>)
      <textarea id="sourcesText" class="mono" rows="14"></textarea>
      <span class="hint muted small">Leer lassen = eingebaute Standardliste. Zeilen mit <code>#</code> am Anfang sind deaktiviert. Für Seiten ohne Feed <code>html</code> und optional ein RegEx-Muster für Artikel-URLs angeben.</span>
    </label>
    <div class="row">
      <button id="btnDefaults" class="ghost">Standardliste einfügen</button>
    </div>
  </section>

  <section class="card">
    <h2>Automatik</h2>
    <label>Relevanz-Schwelle (0–10)
      <input id="minScore" type="number" min="0" max="10" step="1">
      <span class="hint muted small">Meldungen mit Score ab diesem Wert werden automatisch ausgewählt. 6 = relevant, 8 = nur wichtige.</span>
    </label>
    <label>Max. Meldungen pro Durchlauf
      <input id="maxItemsPerRun" type="number" min="1" max="200" step="1">
    </label>
    <label class="check"><input id="autoTags" type="checkbox"> Tags per Modell nach dem Tagging-Handbuch vergeben (Struktur, News, Quellentyp, Orte, Themen, KI, WB)</label>
    <label class="check"><input id="autoSave" type="checkbox"> Nach dem Ausfüllen automatisch auf „Save“ klicken</label>
    <span class="hint muted small">Aus = jede News wird nur ausgefüllt, du kontrollierst und speicherst selbst.</span>
    <label>Täglicher Start (Mo–Fr), Uhrzeit
      <input id="autoRunTime" type="time">
      <span class="hint muted small">Leer = kein Zeitplan. Chrome muss zu dieser Zeit laufen; die Automatik-Seite öffnet sich und startet „Alles automatisch“.</span>
    </label>
  </section>

  <section class="card">
    <h2>OSDP</h2>
    <label>Datumsformat im OSDP-Datumsfeld
      <input id="osdpDateFormat" type="text" placeholder="dd.MM.yyyy">
      <span class="hint muted small">Platzhalter: dd, MM, yyyy, yy. Bei einem echten <code>&lt;input type="date"&gt;</code> wird automatisch ISO verwendet.</span>
    </label>
    <label>Text für „Autor ungenannt“
      <input id="authorUnknownText" type="text" placeholder="Autor ungenannt">
    </label>
    <label class="check"><input id="fillEnglishTab" type="checkbox"> Reiter „English Translated“ mit dem englischen Original befüllen</label>
    <label class="check"><input id="useSiteExtract" type="checkbox"> OSDP-eigenen „Extract“-Button für den Quelltext verwenden (experimentell)</label>
    <label>URL-Muster des OSDP-Tabs
      <input id="osdpUrlPattern" type="text" placeholder="https://osdp.zentdok.at/*">
    </label>
  </section>

  <div class="row">
    <button id="btnSave" class="primary">Speichern</button>
    <button id="btnTest" class="ghost">Übersetzung testen</button>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
